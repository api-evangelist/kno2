  Kno2 documents no idempotency-key header/parameter anywhere in its published
  OpenAPI or the ApiTestClient - message drafting/sending has no client-supplied
  idempotency token, so no `type: Idempotency` pointer is emitted alongside
  this artifact (an honest absence, not an oversight).
