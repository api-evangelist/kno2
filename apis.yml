description: Kno2 provides Interoperability as a Service for healthcare - a single
  Communication API to SEND, RECEIVE, and FIND patient information across the
  healthcare ecosystem. One connection reaches Direct Secure Messaging, clinical
  document exchange, HL7 FHIR resources, HL7 V2.x, cloud fax, and national record
  location and retrieval through Kno2's private network, Carequality, eHealth
  Exchange, and TEFCA (Kno2 is a federally designated QHIN). API access is
  partner/enterprise gated - integrators are provisioned a per-subscription tenant
  host with OAuth2 client-credentials keys and an IP allowlist; a staging sandbox
  is available through the Kno2 Developer Program.
