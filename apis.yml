apis:
- aid: kno2:kno2-fhir-api
  name: Kno2 FHIR API
  tags:
  - FHIR
  - USCDI
  - Clinical Records
  - Patient Facing
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://kno2.com/connectivity/
  baseURL: https://{subscription}.kno2fy.com
  properties:
  - url: https://kno2.com/wp-content/uploads/2022/09/Kno2-Connectivity-FHIR-2.1.pdf
    type: Documentation
  description: >-
    HL7 FHIR (DSTU3/R4) resource query and retrieval at scale, including USCDI data classes and patient
    demographic search, brokered through Kno2's gateway to Carequality and national FHIR endpoints. MODELED
    - Kno2 documents FHIR as a product capability of the Communication API but the FHIR base URL and resource
    paths are partner-provisioned and not publicly documented.
- aid: kno2:kno2-record-query-api
  name: Kno2 Patient Record Query API
  tags:
  - Health Information Exchange
  - QHIN
  - TEFCA
  - Carequality
  - Care Coordination
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://kno2.com/networks/
  baseURL: https://{subscription}.kno2fy.com
  properties:
  - url: https://kno2.com/api/
    type: Documentation
  description: >-
    On-demand patient record location and retrieval across national networks - Kno2's private network,
    Carequality, eHealth Exchange, and TEFCA (Kno2 is a designated QHIN). Find a patient, query participating
    organizations, and retrieve complete records on demand. MODELED - a documented product capability
    of the Communication API; the specific query/retrieve endpoint paths are partner-provisioned and not
    publicly documented.
